name: Stock Monitor
on:
  schedule:
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Call monitoring endpoint
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          test -n "$MONITOR_URL"
          test -n "$MONITOR_SECRET"
          curl --fail --silent --show-error -H "X-Monitor-Secret: $MONITOR_SECRET" "$MONITOR_URL/api/monitor"
