name: Opening Market Report

on:
  schedule:
    - cron: "7 10 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

jobs:
  opening-report:
    runs-on: ubuntu-latest
    steps:
      - name: Send opening market report
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          test -n "$MONITOR_URL"
          test -n "$MONITOR_SECRET"

          ENDPOINT="$MONITOR_URL/api/opening-report?scheduled=1"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENDPOINT="$MONITOR_URL/api/opening-report?force=1"
          fi

          curl --fail --silent --show-error \
            -H "X-Monitor-Secret: $MONITOR_SECRET" \
            "$ENDPOINT"
