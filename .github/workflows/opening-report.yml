name: Opening Market Report

on:
  workflow_dispatch:

jobs:
  opening-report:
    runs-on: ubuntu-latest
    steps:
      - name: Send manual opening market report test
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          test -n "$MONITOR_URL"
          test -n "$MONITOR_SECRET"

          curl --fail --silent --show-error \
            -H "X-Monitor-Secret: $MONITOR_SECRET" \
            "$MONITOR_URL/api/opening-report?force=1"
