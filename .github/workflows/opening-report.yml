name: Opening Market Report

on:
  schedule:
    # Run away from the top of the hour to reduce GitHub schedule congestion.
    # 14:07 UTC = about 10:07 New York during U.S. daylight saving time.
    # 15:07 UTC = about 10:07 New York during U.S. standard time.
    # Application logic sends only when New York local time is in the 10:00 hour.
    - cron: "7 14 * * 1-5"
    - cron: "7 15 * * 1-5"
  workflow_dispatch:

jobs:
  opening-report:
    runs-on: ubuntu-latest
    steps:
      - name: Send 30-minute opening report
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          test -n "$MONITOR_URL"
          test -n "$MONITOR_SECRET"

          ENDPOINT="$MONITOR_URL/api/opening-report"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENDPOINT="$MONITOR_URL/api/opening-report?force=1"
          fi

          curl --fail --silent --show-error \
            -H "X-Monitor-Secret: $MONITOR_SECRET" \
            "$ENDPOINT"
